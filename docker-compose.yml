#version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: sio-postgres
    environment:
      POSTGRES_USER: sio_user
      POSTGRES_PASSWORD: sio_password
      POSTGRES_DB: sio_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

  backend:
    build: ./backend
    container_name: sio-backend
    environment:
      DB_HOST: db
      DB_USER: sio_user
      DB_PASS: sio_password
      DB_NAME: sio_db
      JWT_SECRET: "chiave_segreta_super_sicura_per_il_corso_segretissimissima"
      AUTH_ENABLED: "false"
    depends_on:
      - db
    restart: always
    networks:
      - backend-net

  fe-sio:
    build:
      context: ./his-afp
      dockerfile: Dockerfile
    image: his-afp:${SVI_VERSION:-latest}
    container_name: sio-fe-sio
    environment:
      APP_ENV: "SVI"
      APP_VERSION: "${SVI_VERSION}"
    networks:
      - frontend-net

  # AMBIENTE PRODUZIONE (BLUE)
  fe-prod:
    build:
      context: ./his-afp
      dockerfile: Dockerfile
    image: his-afp:${PROD_VERSION:-latest}
    container_name: sio-fe-prod
    environment:
      APP_ENV: "PROD"
      APP_VERSION: "${PROD_VERSION}"
    networks:
      - frontend-net

  fe-test:
    build:
      context: ./his-afp
      dockerfile: Dockerfile
    image: his-afp:${TEST_VERSION:-latest}
    container_name: sio-fe-test
    environment:
      APP_ENV: "TEST"
      APP_VERSION: "${TEST_VERSION}"
    networks:
      - frontend-net

  gateway:
    image: nginx:alpine
    container_name: sio-gateway
    ports:
      - "80:80"
      - "8080:8080"
      - "8999:8999"
    volumes:
      - ./gateway:/etc/nginx/conf.d/:ro
    depends_on:
      - fe-sio
      - fe-prod
      - fe-test
      - backend
    restart: always
    # Unico ponte tra le due reti: instrada il traffico verso frontend e backend
    networks:
      - frontend-net
      - backend-net

volumes:
  pg_data:

# frontend-net: portali frontend; backend-net: rete protetta di backend e database
networks:
  frontend-net:
  backend-net:
    # Nessun accesso verso l'esterno: backend e database comunicano solo tra loro e con il gateway
    internal: true
